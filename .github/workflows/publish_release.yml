name: Publish release

on:
  push:
    tags:
     - "v*.*.*"

jobs:
  ensure-on-cross-platform:
    runs-on: ubuntu-latest
    outputs:
      is_on_cross_platform: ${{ steps.check.outputs.on_cross_platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history is required for branch ancestry checks

      - name: Check if tag is on Cross_platform
        id: check
        run: |
          if git merge-base --is-ancestor ${{ github.sha }} origin/Cross_platform; then
            echo "on_cross_platform=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_cross_platform=false" >> "$GITHUB_OUTPUT"
          fi

  build_linux_wheel_and_test:    
    needs: ensure-on-cross-platform
    if: needs.ensure-on-cross-platform.outputs.is_on_cross_platform == 'true'
    uses: ./.github/workflows/build_linux_wheel_and_test.yml
    with:
      called: true
      run_smoke_test: false

  build_windows_wheel_and_test:    
    needs: ensure-on-cross-platform
    if: needs.ensure-on-cross-platform.outputs.is_on_cross_platform == 'true'
    uses: ./.github/workflows/build_windows_wheel_and_test.yml
    with:
      called: true
      run_smoke_test: false

  build_installer_and_test:    
    needs: ensure-on-cross-platform
    if: needs.ensure-on-cross-platform.outputs.is_on_cross_platform == 'true'
    uses: ./.github/workflows/build_installer_using_cmake_and_test.yml
    with:
      called: true

  publish_wheels_to_PyPi:
    needs: [
      build_linux_wheel_and_test,
      build_windows_wheel_and_test,
    ]
    runs-on: ubuntu-latest    
    steps:

    # - name: Install uv
    #   uses: astral-sh/setup-uv@v10
    #   with:
    #       enable-cache: false

    - name: Download Linux Wheel
      uses: actions/download-artifact@v8
      with:
        name: python_wheel_gcc_linux
        path: dist

    - name: Download Windows Wheel
      uses: actions/download-artifact@v8
      with:
        name: python_wheel_VS_2022_Windows_x64
        path: dist

    # # I'm not sure setting up a Trusted Publisher workflow will work from a non-main branch
    # - name: Publish to PyPI
    #   run: uv publish ./dist/*

    
    - name: Publish package
      if: github.repository == 'fiftysevendegreesofrad/sdna_plus'
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 #v1.14.3
      with:
        user: __token__
        password: ${{ secrets.PUBLISH_SDNA_PLUS_RELEASE_PYPI }}
        packages-dir: dist/


  publish_release:
    needs: [
      build_linux_wheel_and_test,
      build_windows_wheel_and_test,
      build_installer_and_test,
    ]
    runs-on: ubuntu-latest    
    permissions:
      contents: write
    steps:

    - name: Download Linux Wheel
      uses: actions/download-artifact@v8
      with:
        name: python_wheel_gcc_linux
        path: dist

    - name: Download Windows Wheel
      uses: actions/download-artifact@v8
      with:
        name: python_wheel_VS_2022_Windows_x64
        path: dist
        
    - name: Download installer
      uses: actions/download-artifact@v8
      with:
        name: installer_file
        path: dist


    - name: Release
      uses: softprops/action-gh-release@v3
      if: github.ref_type == 'tag'
      with:
        working_directory: dist
        files: |
          *.*